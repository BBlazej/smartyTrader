[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous paper-trading agents powered by a local LLM"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "pandas-ta>=0.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
stocks = [
    "yfinance>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing -v"

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
