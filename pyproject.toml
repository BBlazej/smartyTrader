[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous paper-trading agents powered by a local LLM"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    # §7.15 control plane: agent-side control API + dashboard (server-rendered).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    # §7.16 XTB demo execution: xAPI WebSocket client (imported lazily; unit
    # tests never touch it).
    "websockets>=12",
]

[project.optional-dependencies]
stocks = [
    "yfinance>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing -v"

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Deterministic discovery for non-editable installs (the Docker image ships the
# package itself): `src*` is the application package, `scripts*` the entry points.
[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

# The dashboard's Jinja2 templates live inside the package and must ship with it.
[tool.setuptools.package-data]
"src.dashboard" = ["templates/*.html"]
