llm:
  endpoint: "http://127.0.0.1:1234/v1/chat/completions"
  # Served by Unsloth desktop (LOCAL_LLM_ENDPOINT in .env); its loaded model's id.
  model: "unsloth/Qwen3.8-27B-GGUF"
  # Whole-response budget: requests aren't streamed, so the full completion (incl.
  # any <think> reasoning) must arrive within this. A local 27B model needs minutes
  # for thousands of tokens. The scheduler never overlaps cycles (max_instances=1).
  timeout_seconds: 300
  max_retries: 3
  use_json_schema: false   # enable once the local model accepts response_format
  temperature: 0.2         # sampling temperature sent with every request (§7.19)
  # Completion cap per request (§7.19) — NOT the context window (set that in LM
  # Studio when loading the model; prompt + max_tokens must fit inside it). Room
  # for Qwen3 reasoning + the JSON; truncation logs llm_response_truncated (§7.57).
  max_tokens: 8192
  retry_backoff_base_seconds: 1.0   # exponential backoff between retries; 0 = off
  seed: null               # set an integer for deterministic evaluation (§7.33); null omits it
  # Raw completion size cap before parsing (§7.33); 0 = guard off. Keep it ≈4×
  # max_tokens (~4 chars/token) or long answers are discarded before the parser.
  max_response_chars: 36000

crypto_agent:
  enabled: true
  # OKX Europe (ccxt "myokx", host eea.okx.com — MiCA-licensed; §7.64). Without
  # EXCHANGE_API_KEY this is live public data + the paper executor. With keys,
  # `testnet: true` trades the OKX **demo** (sandbox mode); a keyed live run needs
  # `testnet: false` AND `live_trading: true` AND LIVE_TRADING_ACK in the env (§7.41).
  exchange: myokx
  testnet: true
  live_trading: false
  # Cash currency of the keyed executor; every pair must be quoted in it. EEA
  # accounts can't trade USDT (MiCA) — EUR (or USDC) pairs only.
  quote_currency: EUR
  interval_minutes: 5
  # Sized from measured LLM latency (2026-10-01 demo run: median 21 s, max 33 s per
  # decision): at a new bar every pair is asked in turn, so ~12 pairs ≈ 4 min of LLM
  # time — fits one 5-minute cycle, so SL/TP checks are never held up for long. All
  # are tradable on the OKX EEA *demo* (27 EUR pairs there vs 271 live) and liquid.
  pairs:
    - BTC/EUR
    - ETH/EUR
    - XRP/EUR
    - SOL/EUR
    - LINK/EUR
    - DOGE/EUR
    - BNB/EUR
    - SUI/EUR
    - NEAR/EUR
    - AAVE/EUR
    - XLM/EUR
    - ONDO/EUR
  decision_history_limit: 10   # prior decisions fed back into the prompt (0 = off)
  timeframe: "1h"              # candle timeframe the LLM decides on (§7.56)
  # §7.56: ask the LLM once per newly CLOSED bar; the 5-min cycles in between only
  # mark positions and enforce stop-loss/take-profit. false = ask every cycle.
  decide_on_new_bar_only: true
  # Screener-driven dynamic watchlist (§7.70, CHANGE.md §4.4). Off by default —
  # with it off the traded set is exactly `pairs` above. When on, a deterministic
  # screener (liquidity floor → volatility band → momentum rank over OKX EUR-quoted
  # spot) adds up to max_dynamic_symbols extra pairs with a TTL; core pairs and any
  # symbol with an open position are NEVER dropped. Audited in `watchlist_entries`.
  watchlist:
    enabled: false
    refresh_minutes: 360          # screener cadence while the runner is alive
    max_dynamic_symbols: 2        # hard cap on manager-added pairs
    ttl_hours: 96                 # a dynamic pair is dropped (slot freed) after this
    min_quote_volume_24h: 1000000 # liquidity floor, in quote currency (EUR)
    momentum_days: 14             # ranking window on daily bars
    lookback_days: 30             # candle depth for volatility estimate
    min_daily_volatility: 0.005   # below this the pair is dead-flat (daily returns σ)
    max_daily_volatility: 0.25    # above this it is a blow-up risk — skip
    max_candidates: 20            # candle fetches per refresh (best liquidity first)
    exclude_symbols: []           # never add these, e.g. ["USDC/EUR", "WBTC/EUR"]
    # §7.83: candidates named in >= min_mentions recent news items (context.news, incl.
    # items naming no traded pair) move ahead of unmentioned ones — after every filter,
    # screener order kept within each group. Off by default.
    news_mentions: {enabled: false, lookback_hours: 48, min_mentions: 2}
  # Strategy sleeves (§7.71, CHANGE.md P1). Off by default — with it off the agent
  # runs one implicit style on `timeframe` above. When on, each sleeve decides on
  # its own candle timeframe with its own prompt playbook over the same pairs;
  # decisions/orders are tagged with the sleeve (`strategy` column). A symbol is
  # held by at most one sleeve (symbol lock — the first listed wins a tie), and a
  # position older than its sleeve's holding limit is closed deterministically
  # (time stop — no LLM, no risk gate, like SL/TP).
  # Each sleeve trades its own book: weight × the allocation's cost-basis equity +
  # its own PnL, gated by its own risk limits (the `risk:` block below + the
  # sleeve's `risk:` overrides; a dashboard tightening caps every sleeve). A new
  # allocation is recorded when the weights change (re-bases every sleeve's peak).
  sleeves:
    enabled: false
    # Loose agent-wide breaker (CHANGE.md §4.8): agent equity this far below its
    # peak blocks new entries in every sleeve, whatever their own limits say.
    backstop_max_drawdown_pct: 0.20
    strategies:
      crypto_swing:               # holds of hours to ~3 days
        timeframe: "1h"
        playbook: swing           # momentum/mean-reversion, tight SL/TP
        holding: {max_hours: 72}
        weight: 0.5
        risk: {max_position_pct: 0.05, daily_loss_limit_pct: 0.02, max_drawdown_pct: 0.06, max_stop_distance_pct: 0.08}
      crypto_position:            # holds of days to weeks (CHANGE.md Q3)
        timeframe: "4h"
        playbook: position        # trend-following, wider stops, few trades
        holding: {max_days: 28}
        weight: 0.5
        risk: {max_position_pct: 0.10, daily_loss_limit_pct: 0.04, max_drawdown_pct: 0.15, max_stop_distance_pct: 0.20}
  # Market context (§7.18, CHANGE.md P5). A background job (refresh_minutes) pulls
  # free, key-less sources into the DB; every decision's prompt gets a MARKET CONTEXT
  # section, and the risk engine's event guard (risk.event_* below) blocks new BUYs
  # around high-impact macro events and after a venue delisting notice. Exits are
  # never gated. Raw news text never reaches the trading prompt — only the
  # summarizer's validated, bounded context cards do.
  context:
    enabled: true
    refresh_minutes: 60
    lookahead_hours: 48           # upcoming events shown in the prompt
    sentiment: {enabled: true}    # crypto Fear & Greed (alternative.me), daily
    macro:                        # events from `macro_calendar` below
      enabled: true
      currencies: [USD, EUR]      # FOMC/CPI/NFP and ECB move crypto too
      min_importance: high
    announcements: {enabled: true}   # OKX Europe delisting notices
    news:
      enabled: true               # RSS ingest — stored for the summarizer only
      feeds:
        - {name: coindesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/"}
        - {name: cointelegraph, url: "https://cointelegraph.com/rss"}
        - {name: theblock, url: "https://www.theblock.co/rss.xml"}
      # The base asset (BTC, ETH, …) always matches as an upper-case word; these
      # add case-insensitive names.
      aliases:
        BTC/EUR: [bitcoin]
        ETH/EUR: [ethereum, ether]
        SOL/EUR: [solana]
        NEAR/EUR: [near protocol]
        XRP/EUR: [ripple]
        LINK/EUR: [chainlink]
        DOGE/EUR: [dogecoin]
        BNB/EUR: [binance coin]
        XLM/EUR: [stellar]
    # LLM digest of each symbol's news → context cards (TTL'd, validated). Off until
    # the second-model question is settled (CHANGE.md Q7): with it on, the summarizer
    # shares the local server with trading decisions (one lock — never concurrent).
    # `llm:` may override model/max_tokens/timeout_seconds/… of the llm block above.
    summarizer:
      enabled: false
      refresh_minutes: 240
      card_ttl_hours: 12
      lookback_hours: 24
      max_items_per_card: 8
      max_symbols_per_run: 5
      llm: {max_tokens: 4096}

stocks_agent:
  enabled: false
  interval_minutes: 15
  # §7.68: the window must match the exchange of the symbols actually traded —
  # these are US stocks (NYSE), not the Warsaw session the block inherited from
  # the XTB/GPW origins. Regular hours 09:30–16:00 America/New_York.
  market_hours: "09:30-16:00"   # local wall-clock window for the exchange
  market_timezone: "America/New_York"   # zone the window is in (so a UTC host stays correct)
  # Exchange closure dates (§7.10, ISO YYYY-MM-DD). Weekends are always closed;
  # fill in holidays/one-off shutdowns here (validated at startup — bad entries
  # abort with an actionable error rather than silently disabling the guard).
  # NYSE full-day closures for the rest of 2026 plus 2027 (§7.68) — extend as
  # needed; half-day early closes are not expressible (the window guard only
  # skips whole days).
  market_holidays:
    - "2026-11-26"   # Thanksgiving
    - "2026-12-25"   # Christmas
    - "2027-01-01"   # New Year's Day
    - "2027-01-18"   # MLK Day
    - "2027-02-15"   # Presidents' Day
    - "2027-03-26"   # Good Friday
    - "2027-05-31"   # Memorial Day
    - "2027-06-18"   # Juneteenth (observed — June 19 is a Saturday)
    - "2027-07-05"   # Independence Day (observed — July 4 is a Sunday)
    - "2027-09-06"   # Labor Day
    - "2027-11-25"   # Thanksgiving
    - "2027-12-24"   # Christmas (observed — December 25 is a Saturday)
  symbols:
    - AAPL
    - MSFT
  # §7.66 per-exchange windows for a mixed US + EU universe: symbols listed under
  # symbol_exchanges trade in their exchange's window; all others use the
  # market_hours/market_timezone/market_holidays above. A cycle is skipped only when
  # every window in use is closed. Fill in each exchange's closure dates before use.
  exchanges: {}
  #   XETR:
  #     market_hours: "09:00-17:30"
  #     market_timezone: "Europe/Berlin"
  #     market_holidays: []
  symbol_exchanges: {}
  #   SAP.DE: XETR
  decision_history_limit: 10   # prior decisions fed back into the prompt (0 = off)
  timeframe: "1d"              # daily bars (yfinance); indicators use closed bars only
  decide_on_new_bar_only: true # one LLM decision per closed daily bar (§7.56)
  # Market context (§7.18; live-checked 2026-09-29, §7.66 step 6). Earnings dates via
  # yfinance drive the earnings blackout; SEC EDGAR 8-K filings (per-company Atom
  # feeds) feed the summarizer. SEC asks for a contact in the User-Agent — set
  # context.http_user_agent to "<name> <email>" before running this unattended.
  context:
    enabled: true
    macro: {enabled: true, currencies: [USD], min_importance: high}
    earnings: {enabled: true, lookahead_days: 45}
    news:
      enabled: true
      feeds:
        - name: edgar_aapl
          url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=AAPL&type=8-K&count=10&output=atom"
          symbols: [AAPL]
        - name: edgar_msft
          url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=MSFT&type=8-K&count=10&output=atom"
          symbols: [MSFT]
    summarizer: {enabled: false}

risk:
  max_position_pct: 0.10
  daily_loss_limit_pct: 0.02
  max_drawdown_pct: 0.05
  consecutive_losses_cooldown_minutes: 60
  consecutive_losses_threshold: 3   # streak that arms the cooldown (§7.19)
  max_open_positions: 5
  min_confidence: 0.6
  # Entry geometry (§7.54): a BUY's stop must sit BELOW the current price and within
  # this fraction of it (an SL at 0.01 = unbounded risk); take_profit, when given,
  # must be ABOVE the price. Wider stops are rejected at the gate.
  max_stop_distance_pct: 0.25
  # Optional risk-per-trade sizing (§7.54): > 0 caps each BUY so
  # (entry − stop) × quantity ≤ this fraction of total value. 0 = disabled.
  risk_per_trade_pct: 0.0
  # Deterministic stop-loss / take-profit enforcement (§7.9): when a position's
  # mark price breaches the levels carried from its entry signal, the pipeline
  # closes it on the next cycle without asking the LLM or the risk gate.
  enforce_exit_levels: true
  # Event guard (§7.18) — needs <agent>.context.enabled. Deterministic, calendar data
  # only; gates new BUYs, never exits. Sleeves may override these in their risk block.
  event_guard_enabled: true
  event_blackout_before_minutes: 120   # no entry this long before a macro event…
  event_blackout_after_minutes: 60     # …or this long after it
  event_guard_min_importance: high     # low | medium | high
  earnings_blackout_days_before: 1     # stocks: no entry the day before earnings…
  earnings_blackout_hours_after: 24    # …until a day after the release
  delisting_blackout_days: 90          # no entry after the venue announced a delisting

# Paper-executor costs so realized PnL (and the LLM's feedback loop) is net of
# fees/slippage (§7.65). The flat fields are the generic default schedule; a
# percentage-only venue has no minimum. paper_costs overrides per runner component,
# so each paper book simulates the venue it stands in for.
execution:
  paper_fee_pct: 0.001
  paper_slippage_pct: 0.001
  paper_min_commission: 0.0   # absolute per-side floor, book currency (0 = none)
  paper_fx_fee_pct: 0.0       # charged when trades settle in a foreign currency
  initial_cash: 1000.0     # seeds a fresh paper portfolio (sized to the real plan); after the first cycle
                           # the persisted snapshot (and restart rehydration) wins
  # Per-venue profiles (§7.65). Crypto charges what the OKX account actually charges
  # (§7.75): the keyed account reports maker 0.10% / taker 0.20%, and every agent
  # order is a taker (crossed BUY limit, market SELL) — so 0.20%/side. Re-check with
  # `python -m scripts.demo_round_trip` (prints the account's tier) if it changes.
  # Stocks mirrors Saxo US-equities pricing: 0.08%/side
  # with a min ~1 unit/side (~1% on a €100 position — invisible to a percentage-only
  # model) plus 0.25% FX per EUR↔USD conversion (avoidable later by holding USD).
  paper_costs:
    crypto:
      paper_fee_pct: 0.002
    stocks:
      paper_fee_pct: 0.0008
      paper_min_commission: 1.0
      paper_fx_fee_pct: 0.0025

# Scheduled macro events for the market context + event guard (§7.18), shared by
# both agents (each picks currencies in <agent>.context.macro). `events` is the
# reliable base, maintained here (times in UTC, taken from the official calendars
# on 2026-09-29: federalreserve.gov FOMC calendar — decision 14:00 ET on day two;
# ecb.europa.eu Governing Council calendar — decision 14:15 CET/CEST). CPI and
# payrolls come from the ForexFactory weekly feed (`feed_url`, unofficial; "" turns
# it off) — add them here too if you want them independent of that feed. Extend
# the list before it runs out (the last entries are December 2027).
macro_calendar:
  feed_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  events:
    - {at: "2026-10-28T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2026-12-09T19:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-01-27T19:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-03-17T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-04-28T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-06-09T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-07-28T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-09-15T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-10-27T18:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2027-12-08T19:00:00Z", title: "FOMC rate decision", currency: USD}
    - {at: "2026-10-29T13:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2026-12-17T13:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-02-04T13:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-03-18T13:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-04-29T12:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-06-10T12:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-07-22T12:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-09-09T12:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-10-28T12:15:00Z", title: "ECB monetary policy decision", currency: EUR}
    - {at: "2027-12-16T13:15:00Z", title: "ECB monetary policy decision", currency: EUR}

# Keyed crypto venue orders (§7.75) — how CcxtExecutor turns the pipeline's reference
# price (the last close) into a venue order. Paper execution ignores this block.
venue_orders:
  entry_offset_pct: 0.002         # BUY limit = close × (1 + this): crosses the spread (sizing reserves it)
  exit_order_type: market         # every SELL closes a long (§7.47) and must fill: market | limit
  exit_offset_pct: 0.005          # exit_order_type: limit → SELL limit = close × (1 − this)
  order_ttl_seconds: 600          # cancel a venue order still working after this (0 = never)
  fill_confirm_delay_seconds: 1.0 # one fetch_order this long after placing (same-cycle fills)

storage:
  # §7.78: one SQLite file per agent × trading mode — <data_dir>/<mode>_<agent>.db
  # (paper_crypto.db, demo_crypto.db, …). The runner derives the file from the
  # executor's venue; it is never configured here. data_dir holds them all.
  data_dir: "data"
  # Retention (§7.12). Market snapshots are re-creatable cache (~100-candle JSON
  # per symbol-cycle — the space hog), so they prune by default. Decisions/orders
  # are the trade record (audit + fine-tuning data): kept forever unless you set
  # history_retention_days > 0. portfolio_snapshots are NEVER pruned — the
  # drawdown high-water seed reads MAX over their full history.
  snapshot_retention_days: 30
  history_retention_days: 0
  prune_interval_minutes: 1440   # how often runners prune while alive (startup always)
  # §7.35: timestamped DB snapshot before EVERY prune (SQLite online backup).
  # Set backup_dir to "" to disable; backup_keep rotates old backups (0 = keep all).
  backup_dir: "data/backups"
  backup_keep: 14
  # Market-context rows (§7.18: events, sentiment, news, context cards) older than
  # this are pruned with the other retention passes; 0 keeps them.
  context_retention_days: 30

monitoring:
  log_level: INFO
  alert_dedup_window_seconds: 300
  # §7.51 alert channel: set ALERT_WEBHOOK_URL in .env (never here — the URL is a
  # secret) to POST alerts to Slack/Discord/any JSON webhook ("json") or ntfy ("ntfy").
  alert_webhook_format: json
  alert_min_severity: warning   # info | warning | error

# Agent-side control API (§7.15). Off by default: nothing listens unless you enable
# it. The dashboard shares the Docker network (or this host); binds to loopback by
# default, and credentials are structurally absent from every endpoint.
control_api:
  enabled: false
  host: "127.0.0.1"
  crypto_port: 8101
  stocks_port: 8102

# Standalone web dashboard (§7.15 P3–P4): FastAPI + Jinja2/HTMX. Run it separately
# (`python -m scripts.run_dashboard`); it opens every per-mode book (§7.78) and writes
# control latches directly, so it works with or without the agent-side control API.
# Loopback by default; credentials are structurally absent from every page.
dashboard:
  host: "127.0.0.1"
  port: 8080
  refresh_seconds: 5           # HTMX polling interval for live fragments
  agents: ["crypto", "stocks"] # which control rows to show/control
  # §7.24 process supervision: Start/Stop buttons spawn/terminate local
  # `scripts.run_<agent>_agent` runners (logs: data/agent_<name>.out.log). Only ever
  # stops processes this dashboard launched. Keep FALSE under docker-compose —
  # services there are managed by compose, not by the dashboard container.
  allow_launch: false

# XTB demo execution via xAPI (§7.16). DEAD PATH (2026-09-26, §7.66): XTB closed
# its API access on 2025-03-14; wss://ws.xapi.pro is an unofficial third-party
# relay kept only as reference until the Saxo OpenAPI executor replaces it.
# Keep this block disabled. (Historic behavior: when enabled AND XTB_ACCOUNT_ID +
# XTB_ACCOUNT_PASSWORD are set (.env; the password is the xAPI verification code
# from xStation settings, NOT your login password), the stocks runner executed
# against the XTB *demo* account over wss://ws.xapi.pro/demo. Deliberately outside
# the dashboard's safe-config whitelist: turning on real execution must never be a
# web-form click.)
xtb_execution:
  enabled: false
  host: "wss://ws.xapi.pro"
  account_type: "demo"          # demo | real — validated at startup; keep demo
  request_timeout_seconds: 10
  # Data (yfinance) → xAPI symbol table (§7.59 L8); unmapped symbols pass through.
  # Check exact names in xStation (getAllSymbols) before enabling execution.
  symbol_map: {}
  #   AAPL: "AAPL.US"

# Stocks execution on Saxo OpenAPI (§7.66) — replaces the dead XTB path. Off by
# default: the paper executor stays. When enabled AND SAXO_ACCESS_TOKEN is set
# (.env; for SIM the 24 h developer token from developer.saxo), the stocks runner
# trades Saxo's free simulation account. environment: live is real money and also
# needs LIVE_TRADING_ACK (§7.41). Enable at most one of xtb_execution/saxo_execution.
# Outside the dashboard's safe-config whitelist — a venue switch is never a click.
saxo_execution:
  enabled: false
  environment: "sim"            # sim | live
  account_key: null             # explicit AccountKey, or pick by currency below
  account_currency: "USD"       # US stocks trade from a USD account (one currency)
  request_timeout_seconds: 10
  fill_poll_delays: [0.5, 1.0, 2.0, 4.0]   # s; still working after → reconciled per cycle
  amount_decimals: 0            # whole shares
  # Data (yfinance) → Saxo symbol; unmapped symbols must resolve unambiguously.
  symbol_map:
    AAPL: "AAPL:xnas"
    MSFT: "MSFT:xnas"
  # OAuth app for unattended runs (§7.66 step 4) instead of the 24 h developer token:
  # SAXO_APP_KEY / SAXO_APP_SECRET in .env, then `python -m scripts.saxo_login` once.
  # The runner refreshes the rotating token pair itself (keep-alive every
  # keepalive_minutes — SIM refresh tokens live 40 min). Token file: 0600, gitignored.
  oauth:
    enabled: false
    redirect_uri: "http://localhost:8765/callback"   # = the app's registered redirect URL
    auth_base_url: null           # null → sim/live.logonvalidation.net by environment
    token_file: null              # null → data/saxo_<environment>.token.json
    refresh_margin_seconds: 120
    keepalive_minutes: 10
